<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azure App Service Python Validation</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0f1d;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #111827;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 480px;
            border: 1px solid #1f2937;
        }
        h1 {
            color: #38bdf8;
            margin-top: 0;
            font-size: 1.8rem;
        }
        p {
            color: #9ca3af;
            line-height: 1.6;
        }
        .tech-badge {
            background-color: #374151;
            color: #ffd43b;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 1.25rem;
            border: 1px solid #4b5563;
        }
        button {
            background-color: #306998;
            color: white;
            border: none;
            padding: 0.75rem 1.75rem;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 1.25rem;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #2b5b84;
        }
        button:active {
            transform: scale(0.98);
        }
        #timestamp {
            font-size: 0.8rem;
            color: #4b5563;
            margin-top: 1.75rem;
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="tech-badge">🐍 Python Flask Runtime Live !</div>
        <h1>Custom Page Verified</h1>
        <p>Your custom static webpage is successfully being served via Gunicorn and Flask from the <code>/home/site/wwwroot</code> Linux filesystem layer.</p>
        
        <button onclick="verifyClient()">Execute JS Diagnostic</button>
        
        <p id="timestamp"></p>
    </div>

    <script>
        // Set dynamic client-side loading timestamp
        document.getElementById('timestamp').innerText = "Instance connection logged at: " + new Date().toLocaleTimeString();

        function verifyClient() {
            alert("App Service Ingress and JavaScript execution verified successfully!");
        }
    </script>

</body>
</html>
